<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 0;
    }

    .container {
      display: grid;
      background-color: #000;
      width: 748px;
      height: 748px;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 155px 22px;
      gap: 9px;
    }

    .redbox {
      background-color: #E72F24;
    }

    .bluebox {
      background-color: #004592;
      border-bottom: 10px solid #000;
    }

    .whitebox_one {
      background-color: #F0F1EC;
    }

    .whitebox_two {
      background-color: #F0F1EC;
      grid-column: span 3;
    }

    .whitebox_three {
      background-color: #F0F1EC;
      grid-row: span 2;
    }

    .whitebox_four {
      background-color: #F0F1EC;
      grid-area: 2 / 2 / 4 /4;
    }

    .whitebox_five {
      background-color: #F0F1EC;
      grid-row:span 2;
    }

    .yellowbox {
      background-color: #F9D01E;
    }
    
    .blackbox {
      background-color: #232629;
    }

  </style>
</head>

<body>
<div class="container">
  <div class="redbox"></div>
  <div class="whitebox_two"></div>
  <div class="whitebox_three"></div>
  <div class="whitebox_four"></div>

  <div class="bluebox"></div>
  <div class="whitebox_five"></div>

  <div class="whitebox_one"></div>
  <div class="yellowbox"></div>
  <div class="blackbox"></div>
</div>
</body>

</html>
