<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    /* Write your CSS Code here */
    .flag {
      background-color:  #d21034;
      position: relative;
      width: 900px;
      height: 600px;
    }
    .flag > p {
      color: white;
      text-align: center;
      font-size: 50px;
      margin-top: 20px;
    }
    .flag > div {
      background-color: #002868;
      width: 900px;
      height: 300px;
      margin-top: 100px;
    }
    .flag > div > div {
      background-color: white;
      position:absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      left: 350px;
      margin: 50px auto;

    }
    .flag > div > div > p {
      font-size: 75px;
      color: black;
      text-align: center;
      margin-top: 70px;
      text-align: center;
      padding: 0;
      margin: 0;
    }

  </style>
</head>

  IMPORTANT! Do not change any HTML
Don't add any classes/ids/elements 
Use what you know about combining selectors

  <div class="flag">
    <p>The Flag</p>
    <div>
      <div>
        <p>of Laos</p>
      </div>
    </div>
  </div>

</html>
